name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret
        run: python manage.py check --settings=config.test_settings

      - name: Run unit/API tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
        run: python manage.py test --settings=config.test_settings
