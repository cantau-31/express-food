name: Backend CI

# Filtre sur backend/** pour coexister avec frontend-build.yml (Rayen) sans doublon.
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-tests:
    name: Django + mongomock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Installer les dependances figees
        run: pip install -r requirements-lock.txt
      - name: Verifier la configuration Django
        run: python manage.py check --settings=config.test_settings
      - name: Lancer les tests (mongomock, sans Atlas)
        run: python manage.py test --settings=config.test_settings
